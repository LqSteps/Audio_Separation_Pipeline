services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.prod
    hostname: Ubuntu-2404-noble-amd64-base
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      # Media inteira com "rslave": Filmes_Entrada é um mount rclone (rclone-filmes.service) e,
      # quando ele reinicia, o remount só aparece no container se vier do diretório pai.
      # Montar Filmes_Entrada direto deixava o container preso no mount antigo
      # ("Transport endpoint is not connected") até reiniciar o container.
      - /root/Audio_Separation_Pipeline/Media:/app/Media:rslave
      - /root/Audio_Separation_Pipeline/logs:/app/logs
      - /root/Audio_Separation_Pipeline/tmp:/app/tmp
      # O Demucs baixa o mdx_extra (640 MB) em /root/.cache/huggingface/hub; sem este volume cada recreate baixava de novo.
      - /root/Audio_Separation_Pipeline/models:/root/.cache/huggingface
      # Só o que o envio ao servidor 1 usa (root@157.180.2.67, porta 31754): o config manda o ssh usar a chave "root".
      - /root/.ssh/config:/root/.ssh/config:ro
      - /root/.ssh/root:/root/.ssh/root:ro
      - /root/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
